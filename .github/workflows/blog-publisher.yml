name: Auto-publish blog

on:
  schedule:
    # Every 2 hours, at :17 past the hour. GitHub throttles/skips scheduled runs
    # (we were only getting ~5 of 8 daily fires), so we run MORE often than needed
    # and the script tops up to the daily target (idempotent). Off-the-hour minute
    # (:17) is less likely to be dropped than the heavily-contended top-of-hour.
    - cron: '17 */2 * * *'
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # let the workflow push commits

concurrency:
  group: blog-publisher     # never run two at once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate & write blog posts (top up to daily target)
        working-directory: scripts/blog-publisher
        env:
          ACTIONS_MODE: 'true'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DAILY_TARGET: '8'    # publish 8 blogs/day
          MAX_PER_RUN: '8'     # a single run can fully catch up if earlier runs were skipped
        run: node publish.js

      - name: Commit & push new blogs
        run: |
          git config user.name "HPC Blog Bot"
          git config user.email "blog-bot@highperformanceclub.co"
          # pull first in case another run pushed while we were generating
          git pull --rebase --autostash origin main || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "blog: automated posts $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Published new blog(s)."
          else
            echo "No new blog this run (daily target already met)."
          fi
